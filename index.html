   ========================================================= */
function margemTxt(custo, preco) {
  custo = +custo || 0; preco = +preco || 0;
  if (!custo || !preco) return '';
  return `Lucro de ${dinheiro(preco - custo)} por unidade (${Math.round((preco - custo) / custo * 100)}% sobre o custo).`;
}

function editarPeca(id) {
  const p = id ? peca(id) : null;
  const v = p || { nome: '', codigo: '', local: '', qtd: 0, minimo: 0, custo: 0, preco: 0 };
  abrirSheet(`<div class="folha">
      ${cIn('Nome da peça', 'id="pNome" placeholder="Óleo 20W50 1L"', v.nome)}
      <div class="par">${cIn('Código', 'id="pCodigo" autocomplete="off"', v.codigo || '')}${cIn('Prateleira', 'id="pLocal" placeholder="A2"', v.local || '')}</div>
      <div class="par">${cIn('Quantidade', 'id="pQtd" inputmode="decimal" placeholder="0"', p ? fmtQtd(v.qtd) : '')}${cIn('Avisar quando tiver', 'id="pMin" inputmode="decimal" placeholder="0"', numCampo(v.minimo))}</div>
      <div class="par">${cIn('Custo em R$', 'id="pCusto" inputmode="decimal" placeholder="0"', numCampo(v.custo))}${cIn('Venda em R$', 'id="pPreco" inputmode="decimal" placeholder="0"', numCampo(v.preco))}</div>
    </div>
    <p class="nota" id="pMargem">${margemTxt(v.custo, v.preco)}</p>
    <button class="btn primario full mt2" data-act="salvarPeca" data-id="${p ? p.id : ''}">Salvar peça</button>
    ${p ? `<button class="btn perigo full" data-act="excluirPeca" data-id="${p.id}">Excluir peça</button>` : ''}`, { id: 'sheetPeca', titulo: p ? 'Editar peça' : 'Nova peça' });
}

/* =========================================================
   BACKUP
   ========================================================= */
async function exportar() {
  salvarPendente();
  const arq = new File([JSON.stringify(db)], `backup-oficina-${hojeArquivo()}.json`, { type: 'application/json' });
  const marcar = () => { db.config.ultimoBackup = Date.now(); salvar(); render(); toast('Backup salvo'); };
  if (navigator.canShare && navigator.canShare({ files: [arq] })) {
    try { await navigator.share({ files: [arq] }); marcar(); }
    catch (e) { if (e.name !== 'AbortError') { baixarArquivo(arq); marcar(); } }
  } else { baixarArquivo(arq); marcar(); }
}

function importar(arquivo) {
  const r = new FileReader();
  r.onload = () => {
    let d;
    try {
      d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.os) || !Array.isArray(d.clientes)) throw new Error('formato');
    } catch (e) { alert('Esse arquivo não é um backup deste app. Escolha o arquivo .json exportado em Ajustes.'); return; }
    if (!confirm(`Importar o backup com ${pl(d.clientes.length, 'cliente', 'clientes')}, ${pl(d.os.length, 'OS', 'OS')} e ${pl((d.estoque || []).length, 'peça', 'peças')}?\n\nIsso SUBSTITUI todos os dados atuais deste iPhone.`)) return;
    const anterior = db;
    try { db = d; normalizar(); }
    catch (e) { db = anterior; alert('Não foi possível ler o backup.'); return; }
    salvar(); fecharTudo(); render(); toast('Backup importado');
  };
  r.readAsText(arquivo);
}

/* =========================================================
   AÇÕES (toques)
   ========================================================= */
const ACOES = {
  aba: el => { salvarPendente(); estado.aba = el.dataset.v; render(); window.scrollTo(0, 0); },
  fab: () => { if (estado.aba === 'oficina') novaEntrada(); else if (estado.aba === 'clientes') novoCliente(); else if (estado.aba === 'estoque') editarPeca(); },
  fechar: () => fecharSheet(),
  filtro: el => { estado.filtro = el.dataset.v; estado.busca = ''; render(); },
  verBaixo: () => { estado.aba = 'estoque'; estado.filtroEst = 'baixo'; render(); window.scrollTo(0, 0); },
  instalar: () => instalar(),
  toastAcao: () => { const f = toastFn; toastFn = null; $('#toast').classList.remove('on'); if (f) f(); },

  /* Oficina */
  abrirOS: el => abrirOS(el.dataset.id),
  avancar: el => {
    const o = ordem(el.dataset.id); if (!o) return;
    const ant = o.status, prox = PROXIMO[ant]; if (!prox) return;
    mudarStatus(o, prox);
    atualizarTela();
    toast(`Nº ${pad(o.numero)}: ${STATUS[prox].label.toLowerCase()}`, { rotulo: 'Desfazer', fn: () => { mudarStatus(o, ant); atualizarTela(); } });
    if (prox === 'pronta') perguntarAvisar(o);
  },
  wpp: el => {
    const o = ordem(el.dataset.id); if (!o) return;
    salvarPendente();
    abrirWpp((cliente(o.clienteId) || {}).telefone, montarMsg(el.dataset.tipo, o));
  },
  wppFechar: el => { ACOES.wpp(el); fecharSheet(); },
  outrasMsgs: el => outrasMsgs(el.dataset.id),

  /* Nova entrada */
  selMoto: el => { const m = moto(el.dataset.id); if (!m || !entrada) return; entrada.motoId = m.id; entrada.clienteId = m.clienteId; rerenderEntrada(); },
  trocarMoto: () => { entrada.motoId = null; entrada.clienteId = null; rerenderEntrada(); },
  selCliente: el => { if (!entrada) return; entrada.clienteId = el.dataset.id; rerenderEntrada(); },
  trocarCliente: () => { entrada.clienteId = null; rerenderEntrada(); },
  criarOS: () => criarOS(),

  /* OS */
  mudarSituacao: () => mudarSituacao(),
  setStatusFechar: el => {
    fecharSheet();
    const s = el.dataset.v;
    if (!osAtual || osAtual.status === s) return;
    mudarStatus(osAtual, s);
    rerenderOS();
    toast(`Situação: ${STATUS[s].label.toLowerCase()}`);
    if (s === 'pronta') perguntarAvisar(osAtual);
  },
  toggleFeito: el => {
    const s = osAtual && osAtual.servicos[+el.dataset.i]; if (!s) return;
    s.feito = !s.feito;
    salvarOS(osAtual);
    el.closest('.svc').classList.toggle('feito', s.feito);
    const cont = $('#contFeitos');
    if (cont) cont.textContent = `${osAtual.servicos.filter(x => x.feito).length} de ${osAtual.servicos.length} feitos`;
  },
  addServico: () => { osAtual.servicos.push({ id: uid(), desc: '', valor: 0, feito: false }); salvarOS(osAtual); rerenderOS(); focarUltimo('[data-svc="desc"]'); },
  addRapido: el => {
    const r = db.config.servicosRapidos[+el.dataset.i]; if (!r || !osAtual) return;
    osAtual.servicos.push({ id: uid(), desc: r.d, valor: +r.v || 0, feito: false });
    salvarOS(osAtual); rerenderOS();
    if (!+r.v) focarUltimo('[data-svc="valor"]'); else toast(`${r.d} adicionado`);
  },
  delServico: el => { osAtual.servicos.splice(+el.dataset.i, 1); salvarOS(osAtual); rerenderOS(); },
  pickPeca: () => abrirPick(),
  escolherPeca: el => {
    const p = peca(el.dataset.id); if (!p || !osAtual) return;
    const l = osAtual.pecas.find(x => x.pecaId === p.id);
    if (l) l.qtd = (+l.qtd || 0) + 1;
    else osAtual.pecas.push({ id: uid(), pecaId: p.id, desc: p.nome, qtd: 1, preco: +p.preco || 0 });
    salvarOS(osAtual);
    fecharSheet();
    rerenderOS();
    toast(`${p.nome} adicionada`);
  },
  novaPecaPick: () => editarPeca(),
  addAvulsa: () => { osAtual.pecas.push({ id: uid(), pecaId: null, desc: '', qtd: 1, preco: 0 }); salvarOS(osAtual); rerenderOS(); focarUltimo('[data-pc="desc"]'); },
  qtdPeca: el => {
    const l = osAtual && osAtual.pecas[+el.dataset.i]; if (!l) return;
    l.qtd = Math.max(1, (+l.qtd || 1) + (+el.dataset.d));
    salvarOS(osAtual); rerenderOS();
  },
  delPeca: el => { osAtual.pecas.splice(+el.dataset.i, 1); salvarOS(osAtual); rerenderOS(); },
  documento: () => abrirDocumento(),
  tipoDoc: el => gerarDocumento(el.dataset.v),
  compartilharDoc: async () => {
    if (!docAtual) { toast('A imagem ainda está sendo gerada'); return; }
    const f = docAtual.file;
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f] }); }
      catch (e) { if (e.name !== 'AbortError') baixarArquivo(f); }
    } else baixarArquivo(f);
  },
  excluirOS: () => {
    const o = osAtual; if (!o) return;
    const msg = o.status === 'entregue'
      ? `Excluir a OS Nº ${pad(o.numero)} do histórico?\n\nAs peças NÃO voltam para o estoque, porque a moto já foi entregue.`
      : `Excluir a OS Nº ${pad(o.numero)}?\n\nAs peças que saíram do estoque voltam para a prateleira.`;
    if (!confirm(msg)) return;
    removerOS(o);
    salvar();
    osAtual = null;
    fecharAte('sheetOS');
    fecharSheet();
    toast('OS excluída');
  },

  /* Clientes */
  abrirCliente: el => abrirCliente(el.dataset.id),
  salvarNovoCliente: () => {
    const nome = $('#ncNome').value.trim();
    if (!nome) { toast('Informe o nome do cliente'); return; }
    const c = { id: uid(), nome, telefone: $('#ncFone').value.trim(), obs: $('#ncObs').value.trim(), criadoEm: Date.now() };
    db.clientes.push(c);
    salvar();
    fecharSheet();
    render();
    abrirCliente(c.id);
    editarMoto(null, c.id);
  },
  wppCliente: el => {
    const c = cliente(el.dataset.id); if (!c) return;
    salvarPendente();
    abrirWpp(c.telefone, `Olá, ${primeiroNome(c.nome)}! Aqui é da ${db.config.oficina}.`);
  },
  editarMoto: el => editarMoto(el.dataset.id || null, el.dataset.cliente || null),
  salvarMoto: el => {
    const placa = fmtPlaca($('#mPlaca').value), modelo = $('#mModelo').value.trim();
    if (!placa && !modelo) { toast('Informe a placa ou o modelo'); return; }
    const id = el.dataset.id;
    if (placa) {
      const dup = db.motos.find(m => m.id !== id && compacto(m.placa) === compacto(placa));
      if (dup) { toast(`Essa placa já está na ficha de ${(cliente(dup.clienteId) || {}).nome || 'outro cliente'}`); return; }
    }
    const dados = { placa, modelo, ano: $('#mAno').value.trim(), cor: $('#mCor').value.trim(), obs: $('#mObs').value.trim() };
    if (id) Object.assign(moto(id), dados);
    else db.motos.push(Object.assign({ id: uid(), clienteId: el.dataset.cliente }, dados));
    salvar();
    fecharSheet();
    atualizarTela();
    toast('Moto salva');
  },
  excluirMoto: el => {
    const m = moto(el.dataset.id); if (!m) return;
    const oss = db.os.filter(o => o.motoId === m.id);
    if (!confirm(`Excluir a moto ${m.placa || m.modelo}${oss.length ? ` e ${pl(oss.length, 'ordem de serviço', 'ordens de serviço')} dela` : ''}?`)) return;
    oss.forEach(removerOS);
    db.motos = db.motos.filter(x => x !== m);
    salvar();
    const cid = m.clienteId;
    fecharTudo();
    abrirCliente(cid);
    toast('Moto excluída');
  },
  novaOSMoto: el => novaEntrada(el.dataset.id),
  excluirCliente: el => {
    const c = cliente(el.dataset.id); if (!c) return;
    const ms = db.motos.filter(m => m.clienteId === c.id);
    const oss = db.os.filter(o => o.clienteId === c.id || ms.some(m => m.id === o.motoId));
    if (!confirm(`Excluir ${c.nome}${ms.length ? `, ${pl(ms.length, 'moto', 'motos')}` : ''}${oss.length ? ` e ${pl(oss.length, 'ordem de serviço', 'ordens de serviço')}` : ''}?\n\nIsso não pode ser desfeito.`)) return;
    oss.forEach(removerOS);
    db.motos = db.motos.filter(m => m.clienteId !== c.id);
    db.clientes = db.clientes.filter(x => x !== c);
    salvar();
    fecharTudo();
    toast('Cliente excluído');
  },

  /* Estoque */
  filtroEst: el => { estado.filtroEst = el.dataset.v; render(); },
  editarPeca: el => editarPeca(el.dataset.id),
  salvarPeca: el => {
    const nome = $('#pNome').value.trim();
    if (!nome) { toast('Informe o nome da peça'); return; }
    const dados = { nome, codigo: $('#pCodigo').value.trim(), local: $('#pLocal').value.trim(), qtd: num($('#pQtd').value), minimo: num($('#pMin').value), custo: num($('#pCusto').value), preco: num($('#pPreco').value) };
    const id = el.dataset.id;
    if (id && peca(id)) Object.assign(peca(id), dados);
    else db.estoque.push(Object.assign({ id: uid(), criadoEm: Date.now() }, dados));
    salvar();
    fecharSheet();
    atualizarTela();
    toast('Peça salva');
  },
  excluirPeca: el => {
    const p = peca(el.dataset.id); if (!p) return;
    if (!confirm(`Excluir “${p.nome}” do estoque?\n\nAs ordens de serviço que usaram essa peça continuam com ela registrada.`)) return;
    db.estoque = db.estoque.filter(x => x !== p);
    salvar();
    fecharSheet();
    atualizarTela();
    toast('Peça excluída');
  },
  ajEst: el => {
    const p = peca(el.dataset.id); if (!p) return;
    p.qtd = (+p.qtd || 0) + (+el.dataset.d);
    salvar();
    render();
  },

  /* Ajustes */
  exportar: () => exportar(),
  restaurarMsgs: () => { if (!confirm('Voltar as três mensagens para o texto original?')) return; Object.assign(db.config, MSG_PADRAO); salvar(); render(); toast('Mensagens restauradas'); },
  addRapidoCfg: () => {
    db.config.servicosRapidos.push({ d: '', v: 0 });
    salvar(); render();
    const els = document.querySelectorAll('[data-rap="d"]');
    if (els.length) els[els.length - 1].focus();
  },
  delRapidoCfg: el => { db.config.servicosRapidos.splice(+el.dataset.i, 1); salvar(); render(); },
  apagarTudo: () => {
    if (!confirm('Apagar TODOS os clientes, motos, ordens de serviço e estoque?\n\nOs dados da oficina e as mensagens continuam.')) return;
    if (!confirm('Tem certeza? Sem um backup, isso não pode ser desfeito.')) return;
    const cfg = db.config;
    db = dbPadrao();
    db.config = cfg;
    salvar(); fecharTudo(); render();
    toast('Dados apagados');
  }
};

/* =========================================================
   EVENTOS
   ========================================================= */
document.addEventListener('click', e => {
  if (!db) return; /* ainda carregando os dados */
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACOES[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el, e);
});

function aoDigitar(e) {
  if (!db) return;
  const el = e.target, d = el.dataset || {};
  if (el.id === 'arqImport') {
    if (e.type === 'change' && el.files && el.files[0]) { const f = el.files[0]; el.value = ''; importar(f); }
    return;
  }
  if (el.id === 'buscaOS') {
    estado.busca = el.value;
    $('#lista').innerHTML = listaOS();
    document.querySelectorAll('.filtros button').forEach(b => b.classList.toggle('on', !estado.busca && b.dataset.v === estado.filtro));
    return;
  }
  if (el.id === 'buscaCli') { estado.buscaCli = el.value; $('#lista').innerHTML = listaClientes(); return; }
  if (el.id === 'buscaEst') { estado.buscaEst = el.value; $('#lista').innerHTML = listaEstoque(); return; }
  if (el.id === 'buscaPick') { $('#listaPick').innerHTML = listaPick(el.value); return; }
  if (el.id === 'pCusto' || el.id === 'pPreco') { $('#pMargem').textContent = margemTxt(num($('#pCusto').value), num($('#pPreco').value)); return; }

  if (d.en && entrada) {
    entrada[d.en] = el.value;
    if (d.en === 'placa') sugerirMotos(el.value);
    if (d.en === 'nome' || d.en === 'fone') sugerirClientes(el.value);
    return;
  }
  if (d.os && osAtual) {
    osAtual[d.os] = d.os === 'desconto' ? num(el.value) : el.value;
    osAtual.atualizadoEm = Date.now();
    salvarDepois();
    if (d.os === 'desconto') atualizarTotais();
    return;
  }
  if (d.svc && osAtual) {
    const s = osAtual.servicos[+d.i]; if (!s) return;
    if (d.svc === 'valor') s.valor = num(el.value); else s.desc = el.value;
    salvarDepois();
    atualizarTotais();
    return;
  }
  if (d.pc && osAtual) {
    const l = osAtual.pecas[+d.i]; if (!l) return;
    if (d.pc === 'preco') l.preco = num(el.value); else l.desc = el.value;
    salvarDepois();
    atualizarTotais();
    const tt = $('#pcTot' + d.i);
    if (tt) tt.textContent = dinheiro((+l.qtd || 0) * (+l.preco || 0));
    return;
  }
  if (d.cli) {
    const c = cliente(d.id); if (!c) return;
    c[d.cli] = el.value;
    salvarDepois();
    return;
  }
  if (d.cfg) {
    db.config[d.cfg] = d.cfg === 'validade' ? Math.max(0, parseInt(el.value, 10) || 0) : el.value;
    salvarDepois();
    return;
  }
  if (d.rap) {
    const r = db.config.servicosRapidos[+d.i]; if (!r) return;
    if (d.rap === 'v') r.v = num(el.value); else r.d = el.value;
    salvarDepois();
  }
}
document.addEventListener('input', aoDigitar);
document.addEventListener('change', aoDigitar);

/* Esconde a barra de baixo enquanto o teclado está aberto */
document.addEventListener('focusin', e => { if (e.target.matches('input:not([type=file]),textarea,select')) document.documentElement.classList.add('digitando'); });
document.addEventListener('focusout', () => setTimeout(() => {
  if (!document.activeElement || !document.activeElement.matches('input,textarea,select')) document.documentElement.classList.remove('digitando');
}, 60));

document.addEventListener('visibilitychange', () => { if (document.hidden) salvarPendente(); });
window.addEventListener('pagehide', salvarPendente);

/* =========================================================
   INÍCIO
   ========================================================= */
carregar()
  .catch(() => { if (!db) db = dbPadrao(); })
  .then(() => render());
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
